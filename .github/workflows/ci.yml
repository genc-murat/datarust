name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.config.cache_key }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # `cache_key` is a comma-free slug used in the cache key (GitHub Actions
        # forbids commas in cache keys). `features` is passed verbatim to cargo.
        config:
          - { features: "",                              cache_key: "default" }
          - { features: "serde",                         cache_key: "serde" }
          - { features: "rayon",                         cache_key: "rayon" }
          - { features: "matrixmultiply",                cache_key: "matrixmultiply" }
          - { features: "datasets",                      cache_key: "datasets" }
          - { features: "serde,rayon",                   cache_key: "serde-rayon" }
          - { features: "serde,matrixmultiply",          cache_key: "serde-matrixmultiply" }
          - { features: "rayon,matrixmultiply",          cache_key: "rayon-matrixmultiply" }
          - { features: "serde,rayon,matrixmultiply",    cache_key: "serde-rayon-matrixmultiply" }
          - { features: "serde,rayon,matrixmultiply,datasets", cache_key: "all-features" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ matrix.config.cache_key }}-${{ hashFiles('Cargo.lock') }}
      - name: Run clippy
        run: cargo clippy -p datarust --all-targets --no-default-features --features "${{ matrix.config.features }}" -- -D warnings

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.config.cache_key }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        config:
          - { features: "",                              cache_key: "default" }
          - { features: "serde",                         cache_key: "serde" }
          - { features: "rayon",                         cache_key: "rayon" }
          - { features: "matrixmultiply",                cache_key: "matrixmultiply" }
          - { features: "datasets",                      cache_key: "datasets" }
          - { features: "serde,rayon",                   cache_key: "serde-rayon" }
          - { features: "serde,matrixmultiply",          cache_key: "serde-matrixmultiply" }
          - { features: "rayon,matrixmultiply",          cache_key: "rayon-matrixmultiply" }
          - { features: "serde,rayon,matrixmultiply",    cache_key: "serde-rayon-matrixmultiply" }
          - { features: "serde,rayon,matrixmultiply,datasets", cache_key: "all-features" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-test-${{ matrix.config.cache_key }}-${{ hashFiles('Cargo.lock') }}
      - name: Run unit + integration tests
        run: cargo test -p datarust --no-default-features --features "${{ matrix.config.features }}" --verbose
      - name: Run doctests
        run: cargo test -p datarust --no-default-features --features "${{ matrix.config.features }}" --doc

  msrv:
    name: MSRV (1.70)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.70.0
      - name: Test with MSRV
        run: cargo test -p datarust --all-features --locked

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the crates.io package
        run: cargo package -p datarust --locked

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p datarust -p datarust-profile --all-features --no-deps

  profile-clippy:
    name: Clippy (datarust-profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-profile-clippy-${{ hashFiles('Cargo.lock') }}
      - name: Run clippy (default features)
        run: cargo clippy -p datarust-profile --all-targets -- -D warnings
      - name: Run clippy (serde feature)
        run: cargo clippy -p datarust-profile --all-targets --features serde -- -D warnings

  profile-test:
    name: Test (datarust-profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-profile-test-${{ hashFiles('Cargo.lock') }}
      - name: Run tests (default features)
        run: cargo test -p datarust-profile --verbose
      - name: Run tests (serde feature)
        run: cargo test -p datarust-profile --features serde --verbose

  profile-package:
    name: Package (datarust-profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the crates.io package
        run: cargo package -p datarust-profile --locked

  site:
    name: Docs and blog site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install site dependencies
        run: npm ci --ignore-scripts
      - name: Build site
        run: npm run build
      - name: Validate generated site
        run: npm run check
