[package]
name = "datarust-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Model Context Protocol (MCP) server for datarust and datarust-profile"
license = "MIT"
repository = "https://github.com/genc-murat/datarust"
homepage = "https://datarust.dev"
readme = "README.md"
keywords = ["mcp", "llm", "machine-learning", "data-profiling", "rust"]
categories = ["command-line-utilities", "science"]

[dependencies]
# Version keys are required for cargo publish; the workspace [patch.crates-io]
# entry keeps development on the local tree.
datarust = { path = "../datarust", version = "0.7", features = ["serde"] }
datarust-profile = { path = "../datarust-profile", version = "0.4", features = ["serde", "csv"] }
# Pinned to the same lines as datarust/datarust-profile to preserve the shared
# Rust 1.70 MSRV across the workspace.
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
