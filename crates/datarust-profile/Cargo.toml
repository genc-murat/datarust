[package]
name = "datarust-profile"
version = "0.3.0"
edition = "2021"
rust-version = "1.70"
description = "One-call data profiling and quality reports for the datarust ecosystem"
license = "MIT"
repository = "https://github.com/genc-murat/datarust"
homepage = "https://datarust.dev"
readme = "README.md"
keywords = ["data-profiling", "eda", "data-quality", "data-exploration", "datarust"]
categories = ["science", "mathematics"]
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/ROADMAP.md",
]

[lib]
name = "datarust_profile"
path = "src/lib.rs"

[features]
default = []
# Enable JSON serialization of profile reports (and `to_json`).
serde = ["dep:serde", "dep:serde_json", "datarust/serde"]

[dependencies]
datarust = "0.6"
# Optional, gated behind the `serde` feature. Pinned to the same lines datarust
# uses in order to preserve the shared Rust 1.70 MSRV across the workspace.
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.145", optional = true }

[dev-dependencies]
criterion = "=0.5.1"
# Keep the shared test graph on the workspace Rust 1.70 MSRV (see datarust).
clap = "=4.4.18"
half = "=2.4.1"

[[bench]]
name = "benchmarks"
harness = false

[[example]]
name = "profile_table"
path = "examples/profile_table.rs"
required-features = ["serde"]

[[example]]
name = "numeric_distribution"
path = "examples/numeric_distribution.rs"

[[example]]
name = "quality_checks"
path = "examples/quality_checks.rs"

[[example]]
name = "categorical_inspection"
path = "examples/categorical_inspection.rs"

[[example]]
name = "missing_values"
path = "examples/missing_values.rs"

[[example]]
name = "duplicate_detection"
path = "examples/duplicate_detection.rs"

[[example]]
name = "type_inference"
path = "examples/type_inference.rs"

[[example]]
name = "real_world_csv"
path = "examples/real_world_csv.rs"
required-features = ["serde"]

[[example]]
name = "custom_report"
path = "examples/custom_report.rs"
required-features = ["serde"]

[[example]]
name = "correlation_analysis"
path = "examples/correlation_analysis.rs"

