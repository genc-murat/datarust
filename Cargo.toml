# datarust — Cargo workspace root
#
# This repository is a Cargo workspace hosting the datarust ecosystem crates.
# Each member under `crates/` is published independently to crates.io with its
# own version, changelog, and feature set.
#
# The `[patch.crates-io]` entry below points workspace members at the *local*
# source tree of `datarust` during development and CI. It is automatically
# ignored by `cargo publish` (path patches are never published), so published
# crates continue to depend on the crates.io release of `datarust`.

[workspace]
resolver = "2"
members = [
    "crates/datarust",
    "crates/datarust-profile",
]

[patch.crates-io]
datarust = { path = "crates/datarust" }
